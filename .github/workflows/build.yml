# Testy i budowanie instalatora GALLEY Zegar.
#
# - Każdy push i pull request: SAME TESTY na Linuksie (tanio - darmowy plan liczy minuty Windows podwójnie);
#   zmiany tylko w opisach (*.md) nie uruchamiają niczego.
# - Ręcznie: Actions → „Testy i instalator” → Run workflow, pole „wydanie” (np. 1.0 - musi się zgadzać
#   z APP_VERSION i instalator.iss): testy, budowanie na Windows i wydanie (Release) z GALLEY-Zegar-1.0-Setup.exe.
#   Puste pole = samo sprawdzenie, czy instalator się buduje (bez plików do pobrania: miejsce na pliki
#   z Actions w darmowym planie jest wspólne z Presenterem i bywa pełne - wydania się do niego nie liczą).

name: Testy i instalator

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      wydanie:
        description: "Utwórz wydanie (Release), np. 1.0 - musi się zgadzać z APP_VERSION; puste = tylko sprawdzenie budowania"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: Testy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Biblioteki systemowe Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Biblioteki
        run: python -m pip install -r requirements-dev.txt
      - name: Testy (pytest)
        run: python -m pytest tests -v

  instalator:
    name: Instalator
    needs: testy
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tylko do tworzenia wydania
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Zgodność numeru wersji
        shell: pwsh
        run: |
          $app = (Select-String -Path galley_zegar\__init__.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path instalator.iss -Pattern '#define AppVersion "(.+)"').Matches[0].Groups[1].Value
          Write-Host "APP_VERSION=$app, instalator.iss=$iss"
          if ($app -ne $iss) { throw "Różne numery wersji: galley_zegar/__init__.py ($app) i instalator.iss ($iss)" }
          $want = "${{ github.event.inputs.wydanie }}".Trim().TrimStart('v')
          if ($want -and $want -ne $app) { throw "Wydanie $want nie zgadza się z wersją programu $app" }
          "APP_VERSION=$app" >> $env:GITHUB_ENV

      - name: Biblioteki
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Budowanie programu (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean zegar.spec

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Q instalator.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup zakończył się błędem $LASTEXITCODE" }
          Get-Item instalator\GALLEY-Zegar-Setup.exe | Format-List Name, Length

      - name: Wydanie (z polem „wydanie”)
        if: github.event.inputs.wydanie != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $plik = "instalator\GALLEY-Zegar-$env:APP_VERSION-Setup.exe"
          Copy-Item instalator\GALLEY-Zegar-Setup.exe $plik
          $exists = $true
          try { gh release view $tag *> $null; if ($LASTEXITCODE -ne 0) { $exists = $false } } catch { $exists = $false }
          $beta = @()
          if ($env:APP_VERSION -match '-beta') { $beta = @('--prerelease') }
          if ($exists) {
            gh release upload $tag $plik --clobber
          } else {
            gh release create $tag $plik --target $env:GITHUB_SHA --title "GALLEY Zegar $env:APP_VERSION" --generate-notes @beta
          }
          if ($LASTEXITCODE -ne 0) { throw "Nie udało się utworzyć wydania $tag" }
